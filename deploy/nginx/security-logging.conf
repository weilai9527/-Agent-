# 放入 Nginx 的 http 配置范围，在站点启用 interview_security 访问日志。
# 仅记录路径，不记录查询串、Cookie、Authorization 或完整请求行。
log_format interview_security escape=json
    '{"occurred_at":"$time_iso8601","service":"nginx",'
    '"edge_request_id":"$request_id","request_id":"$upstream_http_x_request_id",'
    '"client_ip":"$remote_addr","method":"$request_method","path":"$uri",'
    '"status_code":$status,"duration_seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time","upstream_status":"$upstream_status",'
    '"bytes_sent":$body_bytes_sent}';
